
name: macOS Remote via Tailscale

on:
  workflow_dispatch:

jobs:
  secure-macos-remote:
    runs-on: macos-15
    timeout-minutes: 360

    steps:

      # 1. Check macOS Environment
      - name: Check macOS Runner
        run: |
          echo "================================"
          echo "macOS Version:"
          sw_vers

          echo "Architecture:"
          uname -m

          echo "Current User:"
          whoami

          echo "================================"
        shell: bash

      # 2. Enable Screen Sharing
      - name: Enable Screen Sharing
        run: |
          echo "Enabling Screen Sharing..."

          sudo launchctl load -w \
            /System/Library/LaunchDaemons/com.apple.screensharing.plist

          echo "Screen Sharing enabled."
        shell: bash

      # 3. Install Tailscale CLI
      - name: Install Tailscale CLI
        run: |
          echo "Installing Tailscale CLI..."

          brew install tailscale

          echo "Tailscale version:"
          tailscale version

          echo "Installation completed."
        shell: bash

      # 4. Start Tailscale Daemon
      - name: Start Tailscale Daemon
        run: |
          echo "Starting Tailscale daemon..."

          sudo brew services start tailscale

          echo "Waiting for daemon..."

          for i in {1..30}; do
            if sudo tailscale status >/dev/null 2>&1; then
              echo "Tailscale daemon is responding."
              break
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          if ! pgrep -x tailscaled >/dev/null; then
            echo "ERROR: Tailscale daemon is not running."
            brew services list
            exit 1
          fi
        shell: bash

      # 5. Connect Tailscale
      - name: Connect Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          echo "Connecting to Tailscale..."

          sudo tailscale up \
            --authkey="${TAILSCALE_AUTH_KEY}" \
            --hostname="gh-macos-${GITHUB_RUN_ID}"

          echo "Tailscale connected!"
          sudo tailscale status
        shell: bash

      # 6. Get Tailscale IP
      - name: Get Tailscale IP
        run: |
          TS_IP=$(sudo tailscale ip -4)

          echo "================================"
          echo "MACOS REMOTE ACCESS"
          echo "================================"
          echo "Tailscale IP: $TS_IP"
          echo "VNC Address: vnc://$TS_IP"
          echo "================================"

          echo "TS_IP=$TS_IP" >> $GITHUB_ENV
        shell: bash

      # 7. Keep Runner Alive
      - name: Keep Connection Alive
        run: |
          echo "================================"
          echo "macOS runner is ready!"
          echo "Waiting for remote connection..."
          echo "================================"

          while true; do
            sleep 300
          done
        shell: bash
