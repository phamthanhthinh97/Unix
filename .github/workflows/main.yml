
name: macOS Remote via Tailscale

on:
  workflow_dispatch:

jobs:
  secure-macos-remote:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Check macOS Runner
        run: |
          echo "macOS Version:"
          sw_vers

          echo "Current User:"
          whoami

          echo "Runner Account:"
          id runner || true
        shell: bash

      - name: Enable Screen Sharing
        run: |
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
        shell: bash

      - name: Install Tailscale
        run: |
          brew install --cask tailscale

          sudo /Applications/Tailscale.app/Contents/MacOS/Tailscale up \
            --authkey="${TAILSCALE_AUTH_KEY}" \
            --hostname="gh-macos-${GITHUB_RUN_ID}"
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: bash

      - name: Get Tailscale IP
        run: |
          TS="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          TS_IP=$($TS ip -4)

          echo "================================"
          echo "Tailscale VNC Address: vnc://$TS_IP"
          echo "================================"

          while true; do
            sleep 300
          done
        shell: bash
